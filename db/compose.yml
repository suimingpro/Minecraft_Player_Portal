services:
  mariadb:
    image: mariadb:lts
    container_name: mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: 
      MARIADB_DATABASE: 
      MARIADB_USER: 
      MARIADB_PASSWORD: 

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - ./data:/var/lib/mysql